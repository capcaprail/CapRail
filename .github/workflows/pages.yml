name: Pages

# Deploys apps/web to GitHub Pages on every push to main. The api and the worker
# are processes with a database connection and an RPC key — they are hosted
# elsewhere, and the panel reaches the api through VITE_API_URL.
#
# Repository settings, once (Settings → Pages: Source = GitHub Actions;
# Settings → Secrets and variables → Actions → Variables):
#   VITE_API_URL          required — the api's public origin, e.g. https://caprail-api.onrender.com
#   VITE_DEVNET_RPC_URL   optional — the node the panel sends transactions to;
#                         it is public in the bundle, so no key here (default:
#                         the public devnet node)
#   PAGES_BASE_PATH       optional — `/` for a custom domain; a project site
#                         lives under /<repo>/ and needs nothing
# The api must list the Pages origin in WEB_ORIGIN, or the browser blocks every
# request with CORS.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits for the running one rather than
# cancelling it — a cancelled deploy leaves Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The bundle reads VITE_API_URL at startup and throws without it; failing
      # here names the missing variable instead of shipping a blank page.
      - name: VITE_API_URL is set
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::repository variable VITE_API_URL is not set (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi

      - name: Build the web
        run: pnpm --filter @caprail/web build
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DEVNET_RPC_URL: ${{ vars.VITE_DEVNET_RPC_URL || 'https://api.devnet.solana.com' }}

      # Pages has no rewrites: an unknown path is served 404.html, and a copy of
      # the app shell there lets the router take over on a deep link.
      - name: SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
