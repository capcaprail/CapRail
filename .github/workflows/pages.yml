name: Pages

# Deploys the site to GitHub Pages on every push to main: the landing page
# (apps/landing, static, no build) at the root and the panel (apps/web) under
# app/. The api and the worker are processes with a database connection and an
# RPC key — they are hosted elsewhere, and the panel reaches the api through
# VITE_API_URL.
#
# Repository settings, once (Settings → Pages: Source = GitHub Actions;
# Settings → Secrets and variables → Actions → Variables):
#   VITE_API_URL          required — the api's public origin, e.g. https://caprail-api.onrender.com
#   VITE_DEVNET_RPC_URL   optional — the node the panel sends transactions to;
#                         it is public in the bundle, so no key here (default:
#                         the public devnet node)
#   PAGES_BASE_PATH       optional — the panel's base; `/app/` for a custom
#                         domain. A project site serves the panel under
#                         /<repo>/app/ and needs nothing
# The api must list the Pages origin in WEB_ORIGIN, or the browser blocks every
# request with CORS.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits for the running one rather than
# cancelling it — a cancelled deploy leaves Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The bundle reads VITE_API_URL at startup and throws without it; failing
      # here names the missing variable instead of shipping a blank page.
      - name: VITE_API_URL is set
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::repository variable VITE_API_URL is not set (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi

      - name: Build the web
        run: pnpm --filter @caprail/web build
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/app/', github.event.repository.name) }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DEVNET_RPC_URL: ${{ vars.VITE_DEVNET_RPC_URL || 'https://api.devnet.solana.com' }}

      # The landing at the root, the panel under app/. Pages has no rewrites and
      # serves a custom 404 only from the site root, so the root 404.html is the
      # panel's shell: a deep link (and an old link from before app/, which the
      # panel moves under app/ itself) lands in the router.
      - name: Assemble the site
        run: |
          mkdir site
          cp -r apps/landing/. site/
          cp -r apps/web/dist site/app
          cp apps/web/dist/index.html site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
