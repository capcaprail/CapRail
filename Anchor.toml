[toolchain]
anchor_version = "1.2.0"
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

[programs.localnet]
caprail = "As8C4JwSGHd7HPvh5KD1FhhLsQphQ8veSdhipiSRWs7g"
caprail_hook = "6EMZVfUkf2wrtwfnESLghWfdWyzDu71uJTJ7dCKG3YEi"

[programs.devnet]
caprail = "As8C4JwSGHd7HPvh5KD1FhhLsQphQ8veSdhipiSRWs7g"
caprail_hook = "6EMZVfUkf2wrtwfnESLghWfdWyzDu71uJTJ7dCKG3YEi"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

# `anchor test` тут не використовується: тести програми — mollusk у `cargo test`,
# без валідатора. Артефакт для мережі збирає `scripts/wsl-build.sh build-sbf`,
# а не `anchor build` (той дає SBPFv3, який Agave 3.1.10 не виконує).
[scripts]
test = "cargo test --workspace"
